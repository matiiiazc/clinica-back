<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ clinic }}{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#fafafa;font-family:-apple-system,
        'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#18181b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
           style="background:#fafafa;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                 style="max-width:480px;background:#fff;border:1px solid #e4e4e7;
                        border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:24px 28px;">
                <h1 style="margin:0 0 16px;font-size:20px;line-height:1.3;">
                  {% block heading %}{{ clinic }}{% endblock %}
                </h1>
                {% block content %}{% endblock %}
                <p style="margin-top:28px;padding-top:16px;border-top:1px solid #e4e4e7;
                          font-size:12px;color:#71717a;">
                  Mensaje automático de {{ clinic }}. No respondas a este correo.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
